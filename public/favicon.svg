<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a4a8e"/>
      <stop offset="100%" stop-color="#0a1f3c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5b8def" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield shape -->
  <path d="M16 2 L28 6.5 L28 16 C28 22.5 22.5 27.8 16 30 C9.5 27.8 4 22.5 4 16 L4 6.5 Z"
        fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Shine overlay -->
  <path d="M16 2 L28 6.5 L28 16 C28 22.5 22.5 27.8 16 30 C9.5 27.8 4 22.5 4 16 L4 6.5 Z"
        fill="url(#shine)"/>

  <!-- Inner shield border -->
  <path d="M16 4.5 L26 8.3 L26 16 C26 21.3 21.8 26 16 28 C10.2 26 6 21.3 6 16 L6 8.3 Z"
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- Star badge in center -->
  <g transform="translate(16,15.5)">
    <!-- Outer star ring -->
    <circle r="6" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
    <!-- Star shape -->
    <polygon points="0,-5 1.18,-1.62 4.76,-1.62 1.9,0.62 2.94,4 0,2 -2.94,4 -1.9,0.62 -4.76,-1.62 -1.18,-1.62"
             fill="#ffffff" opacity="0.95"/>
    <!-- Center circle -->
    <circle r="1.6" fill="url(#bg)"/>
    <!-- Letters PB -->
    <text x="0" y="0.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="1.5" font-weight="700" fill="#ffffff" opacity="0.95">PB</text>
  </g>

  <!-- Top decorative line -->
  <line x1="10" y1="9.5" x2="22" y2="9.5" stroke="rgba(255,255,255,0.2)" stroke-width="0.6"/>
</svg>
