<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión · Panel CAC Policía Oruro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#0a1f3c;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{background:#fff;border-radius:18px;padding:40px 44px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.logo-badge{width:46px;height:46px;border-radius:12px;background:#0a1f3c;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-badge svg{width:26px;height:26px;fill:#fff}
.logo-text h1{font-size:17px;font-weight:700;color:#0a1f3c;line-height:1.2}
.logo-text p{font-size:12px;color:#7a8fa8;font-weight:500;margin-top:2px}
h2{font-size:22px;font-weight:700;color:#0a1f3c;margin-bottom:6px}
.subtitle{font-size:13px;color:#7a8fa8;margin-bottom:28px}
label{display:block;font-size:12px;font-weight:600;color:#3d5068;margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
input{width:100%;padding:11px 14px;border:1.5px solid #dce3ed;border-radius:9px;font-size:14px;font-family:inherit;color:#0a1f3c;outline:none;transition:border-color .15s,box-shadow .15s;background:#fafbfd}
input:focus{border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.12);background:#fff}
input.error{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.field{margin-bottom:20px}
.btn{width:100%;padding:13px;background:#0a1f3c;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:8px;transition:background .15s,transform .08s;letter-spacing:.2px}
.btn:hover{background:#132d55}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#9aabb8;cursor:not-allowed;transform:none}
.alert{background:#fbe9e7;border:1px solid #f5c6c2;color:#922b21;border-radius:9px;padding:11px 14px;font-size:13px;margin-bottom:20px;display:none}
.alert.show{display:block}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:28px;text-align:center;font-size:12px;color:#aab4be}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l6 2.67V11c0 3.89-2.67 7.52-6 8.93-3.33-1.41-6-5.04-6-8.93V7.67L12 5z"/></svg>
    </div>
    <div class="logo-text">
      <h1>Policía Boliviana</h1>
      <p>Centro de Atención Ciudadana · Oruro</p>
    </div>
  </div>

  <h2>Iniciar Sesión</h2>
  <p class="subtitle">Ingresa tus credenciales para acceder al panel operativo</p>

  <div class="alert" id="alert"></div>

  <form id="login-form">
    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" placeholder="Ej. admin" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="btn-login">Ingresar al panel</button>
  </form>

  <p class="footer">Panel CAC · Policía Oruro &copy; 2026</p>
</div>

<script>
var form = document.getElementById('login-form');
var alert = document.getElementById('alert');
var btn = document.getElementById('btn-login');

// Si ya hay token válido, redirigir directo al panel
var token = localStorage.getItem('cac_token');
if (token) {
  fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { if (r.ok) window.location.replace('/'); })
    .catch(function(){});
}

function showError(msg) {
  alert.textContent = msg;
  alert.classList.add('show');
  document.getElementById('username').classList.add('error');
  document.getElementById('password').classList.add('error');
}

function clearError() {
  alert.classList.remove('show');
  document.getElementById('username').classList.remove('error');
  document.getElementById('password').classList.remove('error');
}

form.addEventListener('submit', function(e) {
  e.preventDefault();
  clearError();
  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  if (!username || !password) { showError('Completa usuario y contraseña'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando...';

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  })
  .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
  .then(function(res) {
    if (res.ok) {
      localStorage.setItem('cac_token', res.data.token);
      localStorage.setItem('cac_user', JSON.stringify(res.data.user));
      window.location.replace('/');
    } else {
      showError(res.data.error || 'Error al iniciar sesión');
      btn.disabled = false;
      btn.textContent = 'Ingresar al panel';
    }
  })
  .catch(function() {
    showError('Error de conexión con el servidor');
    btn.disabled = false;
    btn.textContent = 'Ingresar al panel';
  });
});
</script>
</body>
</html>
