<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Chatbot · Policía Oruro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  input,select,button,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cdd5e2;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#aab6c8;background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  @keyframes pulsedot{0%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}70%{box-shadow:0 0 0 9px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
  @keyframes livedot{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes progress{from{transform:translateX(-40%)}to{transform:translateX(140%)}}
  #qr-modal{position:fixed;inset:0;background:rgba(10,31,60,.85);z-index:9999;display:flex;align-items:center;justify-content:center}
  #qr-modal.hidden{display:none}
  #qr-box{background:#fff;border-radius:16px;padding:32px;text-align:center;max-width:380px;width:90%;animation:fadein .25s ease}
  button{font-family:inherit}
</style>
</head>
<body>


<div id="app" style="height:100vh"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
"use strict";

/* ===================== ESTADO ===================== */
var leafletMap = null;

var state = {
  view: 'bandeja',
  filterTipo: 'Todos',
  filterPrioridad: 'Todas',
  search: '',
  selectedId: null,
  composer: '',
  _focus: null,
  convs: [],
  waStatus: 'connecting',
  qrDataUrl: null,
  waPhone: ''
};

/* ===================== HELPERS ===================== */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tipoCol(t){ return ({Emergencia:['#c0392b','#fbe9e7'],Denuncia:['#b9751a','#fbf1e0'],Consulta:['#2f6fed','#e7f0ff']})[t]||['#5a6b82','#eef1f6']; }
function prioCol(p){ return ({Alta:['#c0392b','#fbe9e7'],Media:['#b9751a','#fbf1e0'],Baja:['#1f8a5b','#e6f5ee']})[p]||['#5a6b82','#eef1f6']; }
function estCol(e){ return ({Nuevo:['#2f6fed','#e7f0ff'],'En proceso':['#b9751a','#fbf1e0'],Cerrado:['#5a6b82','#eef1f6']})[e]||['#5a6b82','#eef1f6']; }
function badge(fg,bg){ return 'display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.2px;color:'+fg+';background:'+bg; }
function avatarStyle(t){ var c=tipoCol(t); return 'width:38px;height:38px;border-radius:11px;background:'+c[1]+';color:'+c[0]+';display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0'; }
function now(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function getSel(){ return state.convs.find(function(c){ return c.id===state.selectedId; }); }

function updateConvInState(conv) {
  var idx = state.convs.findIndex(function(c){ return c.id === conv.id; });
  if (idx >= 0) {
    state.convs.splice(idx, 1);
  }
  state.convs.unshift(conv);
}

/* ===================== SOCKET.IO ===================== */
var socket = io();

socket.on('connect', function(){
  // Al conectar, pedir el estado actual como respaldo (por si el evento llegó antes)
  fetch('/api/status').then(function(r){ return r.json(); }).then(function(s){
    if (s.status === 'ready') {
      state.waStatus = 'ready';
      state.waPhone = s.phone || '';
      state.qrDataUrl = null;
    } else if (s.status === 'qr' && s.qrDataUrl) {
      state.waStatus = 'qr';
      state.qrDataUrl = s.qrDataUrl;
    }
    render();
  });
});

socket.on('conversation:updated', function(conv) {
  updateConvInState(conv);
  if (!state.selectedId) state.selectedId = conv.id;
  render();
});

socket.on('conversation:deleted', function(data) {
  state.convs = state.convs.filter(function(c){ return c.id !== data.id; });
  if (state.selectedId === data.id) state.selectedId = null;
  render();
});

socket.on('store:cleared', function() {
  state.convs = [];
  state.selectedId = null;
  render();
});

socket.on('conversations:demo-cleared', function(data) {
  var ids = data.ids || [];
  state.convs = state.convs.filter(function(c){ return ids.indexOf(c.id) === -1; });
  if (ids.indexOf(state.selectedId) !== -1) state.selectedId = null;
  render();
});

socket.on('whatsapp:qr', function(data) {
  state.waStatus = 'qr';
  state.qrDataUrl = data.qrDataUrl;
  render();
});

socket.on('whatsapp:ready', function(data) {
  state.waStatus = 'ready';
  state.qrDataUrl = null;
  state.waPhone = (data && data.phone) ? data.phone : '';
  render();
});

socket.on('whatsapp:logout', function() {
  state.waStatus = 'connecting';
  render();
});


/* ===================== ACCIONES SÍNCRONAS ===================== */
function dispatch(action, el){
  switch(action){
    case 'view-bandeja': state.view='bandeja'; render(); break;
    case 'view-mapa': state.view='mapa'; render(); break;
    case 'view-stats': state.view='stats'; render(); break;
    case 'view-agentes': state.view='agentes'; render(); break;
    case 'view-whatsapp': state.view='whatsapp'; render(); break;
    case 'filter-tipo': state.filterTipo=el.getAttribute('data-val'); render(); break;
    case 'select-conv':
      state.selectedId=el.getAttribute('data-id');
      var c=getSel(); if(c) c.unread=false;
      render(); break;
    case 'estado': apiPatch(getSel(), {estado: el.getAttribute('data-val')}); break;
    case 'tomar-caso': apiTomar(getSel()); break;
    case 'eliminar-caso': apiDelete(getSel()); break;
    case 'send': apiSend(); break;
  }
}

/* ===================== ACCIONES API ===================== */
function apiPatch(conv, changes) {
  if (!conv) return;
  fetch('/api/conversations/' + conv.id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(changes)
  }).then(function(r){ return r.json(); }).then(function(updated){
    updateConvInState(updated);
    render();
  });
}

function apiTomar(conv) {
  if (!conv) return;
  fetch('/api/conversations/' + conv.id + '/tomar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({})
  }).then(function(r){ return r.json(); }).then(function(updated){
    updateConvInState(updated);
    render();
  });
}

function apiDelete(conv) {
  if (!conv) return;
  if (!confirm('¿Eliminar el caso ' + conv.id + '? Esta acción no se puede deshacer desde el panel.')) return;
  fetch('/api/conversations/' + conv.id, { method: 'DELETE' })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.ok) {
        state.convs = state.convs.filter(function(c){ return c.id !== conv.id; });
        if (state.selectedId === conv.id) state.selectedId = null;
        render();
      }
    });
}

function apiSend() {
  var txt = (state.composer || '').trim(); if (!txt) return;
  var s = getSel(); if (!s) return;
  state.composer = '';
  state._focus = 'composer';
  render();
  fetch('/api/conversations/' + s.id + '/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: txt })
  }).then(function(r){ return r.json(); }).then(function(updated){
    updateConvInState(updated);
    render();
  });
}

/* ===================== EVENTOS GLOBALES ===================== */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(t){ dispatch(t.getAttribute('data-action'), t); }
});
document.addEventListener('input', function(e){
  var f = e.target.getAttribute && e.target.getAttribute('data-field');
  if(f==='search'){ state.search=e.target.value; state._focus='search'; render(); }
  else if(f==='composer'){ state.composer=e.target.value; }
});
document.addEventListener('change', function(e){
  var f = e.target.getAttribute && e.target.getAttribute('data-field');
  if(f==='prioridad'){ state.filterPrioridad=e.target.value; render(); }
  else if(f==='agente'){
    var s=getSel();
    if(s) apiPatch(s, { agente: e.target.value });
  }
});
document.addEventListener('keydown', function(e){
  if(e.target.getAttribute && e.target.getAttribute('data-field')==='composer' && e.key==='Enter'){
    e.preventDefault(); state.composer=e.target.value; apiSend();
  }
});

/* ===================== RENDER: SHELL ===================== */
function navItem(action, dot, label, active, badgeNum){
  var hl = active ? '<span style="position:absolute;inset:0;background:rgba(91,141,239,.16);border-radius:9px"></span><span style="position:absolute;left:0;top:8px;bottom:8px;width:3px;background:#5b8def;border-radius:0 3px 3px 0"></span>' : '';
  var bn = badgeNum!=null ? '<span style="position:relative;font-family:\'IBM Plex Mono\',monospace;font-size:11px;font-weight:600;background:#c0392b;color:#fff;padding:1px 7px;border-radius:999px">'+badgeNum+'</span>' : '';
  return '<button data-action="'+action+'" style="position:relative;display:flex;align-items:center;gap:11px;width:100%;border:none;background:transparent;color:#dbe4f3;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500">'
    + hl
    + '<span style="position:relative;width:8px;height:8px;border-radius:3px;background:'+dot+';flex-shrink:0"></span>'
    + '<span style="position:relative;flex:1">'+label+'</span>'+bn+'</button>';
}

function waBadge() {
  if (state.waStatus === 'ready') {
    return '<div data-action="view-whatsapp" style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#1f8a5b;background:#eaf6ef;border:1px solid #cdeada;padding:6px 11px;border-radius:9px;cursor:pointer"><span style="width:7px;height:7px;border-radius:50%;background:#1f8a5b;animation:livedot 1.8s infinite"></span>WhatsApp activo</div>';
  }
  if (state.waStatus === 'qr') {
    return '<div data-action="view-whatsapp" style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#b9751a;background:#fbf1e0;border:1px solid #f5d9a0;padding:6px 11px;border-radius:9px;cursor:pointer;animation:livedot .8s infinite">📱 Escanea QR</div>';
  }
  return '<div data-action="view-whatsapp" style="display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:#5a6b82;background:#eef1f6;border:1px solid #e0e5ee;padding:6px 11px;border-radius:9px;cursor:pointer"><span style="width:7px;height:7px;border-radius:50%;background:#9aa6b6"></span>WA conectando...</div>';
}

function renderShell(content){
  var v=state.view;
  var countNuevos = state.convs.filter(function(c){return c.estado==='Nuevo';}).length;
  var titles={ bandeja:['Bandeja de atención','Conversaciones entrantes del chatbot ciudadano'], mapa:['Mapa de incidentes','Distribución geográfica de casos en Oruro'], stats:['Estadísticas','Indicadores de gestión del centro de atención'], agentes:['Agentes','Disponibilidad y carga de casos del personal'], whatsapp:['Conectar celular de WhatsApp','Vincula el número de WhatsApp del canal ciudadano'] };
  var tt=titles[v]||titles.bandeja;

  return '<div style="height:100vh;display:flex;background:#eef1f6;color:#1a2433;overflow:hidden">'
  + '<aside style="width:252px;flex-shrink:0;background:linear-gradient(180deg,#0b2545 0%,#0a1f3c 100%);color:#dbe4f3;display:flex;flex-direction:column">'
    + '<div style="padding:20px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08)">'
      + '<div style="width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#2f6fed,#5b8def);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;letter-spacing:.5px;box-shadow:0 4px 14px rgba(47,111,237,.4)">PB</div>'
      + '<div style="min-width:0"><div style="font-weight:700;font-size:14px;color:#fff;line-height:1.2">Policía Boliviana</div><div style="font-size:11px;color:#8aa0c0;margin-top:2px;letter-spacing:.3px">Comando Oruro · CAC</div></div>'
    + '</div>'
    + '<div style="padding:14px 12px;flex:1;display:flex;flex-direction:column;gap:3px">'
      + '<div style="font-size:10px;font-weight:600;letter-spacing:1px;color:#64769a;padding:6px 12px 8px">OPERACIÓN</div>'
      + navItem('view-bandeja','#5b8def','Bandeja de atención', v==='bandeja', countNuevos)
      + navItem('view-mapa','#3fae7a','Mapa de incidentes', v==='mapa', null)
      + navItem('view-stats','#d6a23a','Estadísticas', v==='stats', null)
      + navItem('view-agentes','#9b7fe0','Agentes', v==='agentes', null)
      + '<div style="font-size:10px;font-weight:600;letter-spacing:1px;color:#64769a;padding:14px 12px 8px">CANALES</div>'
      + navItem('view-whatsapp', state.waStatus==='ready'?'#3fae7a':state.waStatus==='qr'?'#d6a23a':'#64769a', 'Conectar celular WA', v==='whatsapp', state.waStatus==='qr'?'!':null)
      + '<div style="margin-top:auto;padding:14px 12px 6px"><div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px"><div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#8aa0c0;font-weight:600"><span style="width:7px;height:7px;border-radius:50%;background:#3fae7a;animation:livedot 1.8s infinite"></span>ASISTENTE IA ACTIVO</div><div style="font-size:11.5px;color:#aab8d0;margin-top:7px;line-height:1.5">Clasificando mensajes entrantes y resumiendo en tiempo real.</div></div></div>'
    + '</div>'
    + '<div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:11px"><div style="width:36px;height:36px;border-radius:50%;background:#1d3a66;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#cfe0ff;flex-shrink:0">OG</div><div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Of. Gutiérrez</div><div style="font-size:11px;color:#8aa0c0">Operador · Turno A</div></div><span style="width:8px;height:8px;border-radius:50%;background:#3fae7a;flex-shrink:0"></span></div>'
  + '</aside>'
  + '<div style="flex:1;display:flex;flex-direction:column;min-width:0">'
    + '<header style="height:62px;flex-shrink:0;background:#fff;border-bottom:1px solid #e0e5ee;display:flex;align-items:center;padding:0 22px;gap:18px">'
      + '<div style="min-width:0"><div style="font-size:16px;font-weight:700;color:#15233a;line-height:1.1">'+tt[0]+'</div><div style="font-size:12px;color:#7a8699;margin-top:1px">'+tt[1]+'</div></div>'
      + '<div style="flex:1"></div>'
      + '<div style="display:flex;align-items:center;gap:9px;background:#f1f4f9;border:1px solid #e3e8f0;border-radius:10px;padding:8px 13px;width:260px"><span style="width:14px;height:14px;border:2px solid #9aa6b6;border-radius:50%;flex-shrink:0"></span><input id="searchInput" data-field="search" value="'+esc(state.search)+'" placeholder="Buscar folio, ciudadano o delito…" style="border:none;background:transparent;outline:none;font-size:13px;color:#1a2433;width:100%" /></div>'
      + waBadge()
    + '</header>'
    + '<main style="flex:1;min-height:0;overflow:hidden">'+content+'</main>'
  + '</div>'
  + '</div>';
}

/* ===================== RENDER: BANDEJA ===================== */
function chipStyle(active, fg){
  return active
    ? 'border:1px solid '+fg+';background:'+fg+';color:#fff;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer;display:inline-flex;gap:5px;align-items:center'
    : 'border:1px solid #e3e8f0;background:#fff;color:#5a6b82;font-size:12px;font-weight:500;padding:6px 11px;border-radius:8px;cursor:pointer;display:inline-flex;gap:5px;align-items:center';
}

function renderBandeja(){
  var convs=state.convs;
  var counts={Todos:convs.length,Emergencia:0,Denuncia:0,Consulta:0};
  convs.forEach(function(c){counts[c.tipo]=(counts[c.tipo]||0)+1;});

  var q=state.search.trim().toLowerCase();
  var filtered=convs.filter(function(c){
    if(state.filterTipo!=='Todos' && c.tipo!==state.filterTipo) return false;
    if(state.filterPrioridad!=='Todas' && c.prioridad!==state.filterPrioridad) return false;
    if(q){ var hay=(c.name+' '+c.id+' '+c.delito+' '+c.zona).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });

  var listItems = filtered.map(function(c){
    var tc=tipoCol(c.tipo), pc=prioCol(c.prioridad);
    var selected=c.id===state.selectedId;
    var rowStyle='padding:13px 15px;border-bottom:1px solid #f1f4f9;cursor:pointer;display:flex;flex-direction:column;gap:7px;'+(selected?'background:#f5f8ff;box-shadow:inset 3px 0 0 #2f6fed;':'background:#fff;');
    return '<div data-action="select-conv" data-id="'+c.id+'" style="'+rowStyle+'">'
      + '<div style="display:flex;align-items:center;gap:10px">'
        + '<div style="'+avatarStyle(c.tipo)+'">'+esc(c.initials)+'</div>'
        + '<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><span style="font-weight:600;font-size:13.5px;color:#15233a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.name)+'</span>'+(c.unread?'<span style="width:7px;height:7px;border-radius:50%;background:#2f6fed;flex-shrink:0"></span>':'')+'</div><div style="font-size:11px;color:#9aa6b6;font-family:\'IBM Plex Mono\',monospace;margin-top:1px">'+esc(c.id)+' · '+esc(c.channel)+'</div></div>'
        + '<span style="font-size:11px;color:#9aa6b6;flex-shrink:0">'+esc(c.time)+'</span>'
      + '</div>'
      + '<div style="font-size:12.5px;color:#5a6b82;line-height:1.45;margin-left:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+esc(c.preview)+'</div>'
      + '<div style="display:flex;align-items:center;gap:6px;margin-left:42px;flex-wrap:wrap"><span style="'+badge(tc[0],tc[1])+'">'+esc(c.tipo)+'</span><span style="'+badge(pc[0],pc[1])+'">'+esc(c.prioridad)+'</span><span style="font-size:11px;color:#8a96a8">· '+esc(c.zona)+'</span></div>'
    + '</div>';
  }).join('');

  var listaPane = '<section style="width:384px;flex-shrink:0;border-right:1px solid #e0e5ee;background:#fff;display:flex;flex-direction:column;min-height:0">'
    + '<div style="padding:13px 14px;border-bottom:1px solid #eef1f6;display:flex;flex-direction:column;gap:11px">'
      + '<div style="display:flex;gap:7px;flex-wrap:wrap">'
        + '<button data-action="filter-tipo" data-val="Todos" style="'+chipStyle(state.filterTipo==='Todos','#13315c')+'">Todos <span style="opacity:.6">'+counts.Todos+'</span></button>'
        + '<button data-action="filter-tipo" data-val="Emergencia" style="'+chipStyle(state.filterTipo==='Emergencia','#c0392b')+'">Emergencias <span style="opacity:.6">'+(counts.Emergencia||0)+'</span></button>'
        + '<button data-action="filter-tipo" data-val="Denuncia" style="'+chipStyle(state.filterTipo==='Denuncia','#b9751a')+'">Denuncias <span style="opacity:.6">'+(counts.Denuncia||0)+'</span></button>'
        + '<button data-action="filter-tipo" data-val="Consulta" style="'+chipStyle(state.filterTipo==='Consulta','#2f6fed')+'">Consultas <span style="opacity:.6">'+(counts.Consulta||0)+'</span></button>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:9px"><span style="font-size:11.5px;color:#7a8699;font-weight:500">Prioridad</span>'
        + '<select data-field="prioridad" style="flex:1;border:1px solid #e3e8f0;background:#f7f9fc;border-radius:8px;padding:6px 9px;font-size:12.5px;color:#1a2433;outline:none;cursor:pointer">'
          + ['Todas','Alta','Media','Baja'].map(function(o){return '<option '+(state.filterPrioridad===o?'selected':'')+'>'+o+'</option>';}).join('')
        + '</select></div>'
    + '</div>'
    + '<div style="flex:1;overflow:auto;min-height:0">'+(listItems||'<div style="padding:30px;text-align:center;color:#9aa6b6;font-size:13px">Sin resultados</div>')+'</div>'
  + '</section>';

  var sel=getSel();
  var chatPane;
  if(sel){
    var tc=tipoCol(sel.tipo);
    var meLabel={ ciudadano:'Ciudadano', bot:'Asistente IA · Bot', agente:(sel.agente==='Sin asignar'?'Operador':sel.agente) };
    function renderMsgContent(m, bubble) {
      var t = m.type || 'text';
      var inner = '';
      if (t === 'image' && m.mediaUrl) {
        inner = '<a href="'+esc(m.mediaUrl)+'" target="_blank" style="display:block">'
          + '<img src="'+esc(m.mediaUrl)+'" style="max-width:220px;max-height:260px;border-radius:10px;display:block;cursor:zoom-in" onerror="this.style.display=\'none\'" />'
          + '</a>';

/* ===================== RENDER: ESTADISTICAS ===================== */
function renderStats(){
  var total = state.convs.length;
  var emergencias = state.convs.filter(function(c){ return c.tipo==='Emergencia' && c.estado!=='Cerrado'; }).length;
  var hoy = state.convs.length;
  var cerrados = state.convs.filter(function(c){ return c.estado==='Cerrado'; }).length;
  var tasaRes = total > 0 ? Math.round(cerrados/total*100) : 0;

  var kpis=[
    {label:'Casos hoy', value:String(hoy), sub:'Canal ciudadano activo', col:'#1f8a5b'},
    {label:'Emergencias activas', value:String(emergencias), sub:'Requieren atención', col:'#c0392b'},
    {label:'Tiempo prom. respuesta', value:'3m 12s', sub:'▼ −14% esta semana', col:'#1f8a5b'},
    {label:'Tasa de resolución', value:tasaRes+'%', sub:'meta 85%', col:'#b9751a'}
  ].map(function(k){ return '<div style="background:#fff;border:1px solid #e6ebf2;border-radius:14px;padding:18px;box-shadow:0 1px 2px rgba(16,30,54,.04)"><div style="font-size:12.5px;color:#7a8699;font-weight:500">'+k.label+'</div><div style="font-size:30px;font-weight:700;color:#15233a;margin:8px 0 4px;letter-spacing:-.5px">'+k.value+'</div><div style="font-size:12px;font-weight:600;color:'+k.col+'">'+k.sub+'</div></div>'; }).join('');

  var countTipo = { Denuncia:0, Consulta:0, Emergencia:0 };
  state.convs.forEach(function(c){ countTipo[c.tipo]=(countTipo[c.tipo]||0)+1; });
  var totalT = state.convs.length || 1;
  var pDen=Math.round(countTipo.Denuncia/totalT*100), pCon=Math.round(countTipo.Consulta/totalT*100), pEme=Math.round(countTipo.Emergencia/totalT*100);

  var legend=[['Denuncias',pDen,'#b9751a'],['Consultas',pCon,'#2f6fed'],['Emergencias',pEme,'#c0392b']].map(function(d){ return '<div style="display:flex;align-items:center;gap:10px"><span style="width:11px;height:11px;border-radius:3px;background:'+d[2]+';flex-shrink:0"></span><span style="font-size:13px;color:#33405a;flex:1">'+d[0]+'</span><span style="font-size:13px;font-weight:700;color:#15233a">'+d[1]+'%</span></div>'; }).join('');

  var delitoData=[['Robo a propiedad',41],['Violencia intrafamiliar',28],['Robo de vehículo',17],['Accidente de tránsito',12],['Estafa',9]]; var dmax=41;
  var delitos=delitoData.map(function(t){ var w=Math.round(t[1]/dmax*100); return '<div style="display:flex;align-items:center;gap:14px"><span style="width:170px;font-size:13px;color:#33405a;flex-shrink:0">'+t[0]+'</span><div style="flex:1;height:9px;background:#eef1f6;border-radius:999px;overflow:hidden"><div style="height:100%;width:'+w+'%;background:linear-gradient(90deg,#2f6fed,#5b8def);border-radius:999px"></div></div><span style="width:34px;text-align:right;font-size:13px;font-weight:700;color:#15233a">'+t[1]+'</span></div>'; }).join('');

  return '<div style="height:100%;overflow:auto;padding:24px 28px">'

    + '<div style="flex:1;position:relative;background-image:repeating-linear-gradient(0deg,#e7eef6 0 40px,#e1e9f3 40px 41px),repeating-linear-gradient(90deg,#e7eef6 0 40px,#e1e9f3 40px 41px);min-width:0;overflow:hidden">'
      + '<div style="position:absolute;left:18px;top:18px;background:rgba(255,255,255,.95);border:1px solid #e0e5ee;border-radius:11px;padding:13px 16px;box-shadow:0 4px 14px rgba(16,30,54,.08)"><div style="font-size:14px;font-weight:700;color:#15233a">Mapa de incidentes — Oruro</div><div style="font-size:11.5px;color:#7a8699;margin-top:2px">Incidentes activos en tiempo real · '+activos+' casos</div></div>'
      + pins
      + '<div style="position:absolute;right:18px;bottom:18px;background:rgba(255,255,255,.95);border:1px solid #e0e5ee;border-radius:11px;padding:12px 15px;display:flex;flex-direction:column;gap:9px"><div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#33405a"><span style="width:10px;height:10px;border-radius:50%;background:#c0392b"></span>Emergencia</div><div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#33405a"><span style="width:10px;height:10px;border-radius:50%;background:#b9751a"></span>Denuncia</div><div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#33405a"><span style="width:10px;height:10px;border-radius:50%;background:#2f6fed"></span>Consulta</div></div>'
    + '</div>'
    + '<aside style="width:330px;flex-shrink:0;border-left:1px solid #e0e5ee;background:#fff;overflow:auto;padding:20px"><div style="font-size:14px;font-weight:700;color:#15233a;margin-bottom:16px">Incidentes por zona</div><div style="display:flex;flex-direction:column;gap:10px">'+zonaList+'</div></aside>'

/* ===================== RENDER: WHATSAPP ===================== */
function renderWhatsapp(){
  var isReady = state.waStatus === 'ready';
  var isQR    = state.waStatus === 'qr';

  var statusBar = isReady
    ? '<div style="display:flex;align-items:center;gap:10px;background:#eaf6ef;border:1px solid #b7e4cc;border-radius:11px;padding:14px 18px"><span style="width:10px;height:10px;border-radius:50%;background:#1f8a5b;flex-shrink:0;animation:livedot 1.8s infinite"></span><div><div style="font-size:13.5px;font-weight:700;color:#1f8a5b">WhatsApp conectado correctamente</div>'+(state.waPhone?'<div style="font-size:12px;color:#3a7a5a;margin-top:2px">Número vinculado: <b>+'+esc(state.waPhone)+'</b></div>':'')+'</div></div>'
    : isQR
    ? '<div style="display:flex;align-items:center;gap:10px;background:#fbf1e0;border:1px solid #f5d9a0;border-radius:11px;padding:14px 18px"><span style="width:10px;height:10px;border-radius:50%;background:#d6a23a;flex-shrink:0;animation:livedot 1s infinite"></span><div style="font-size:13.5px;font-weight:700;color:#b9751a">Código QR listo — escanéalo ahora</div></div>'
    : '<div style="display:flex;align-items:center;gap:10px;background:#f1f4f9;border:1px solid #e0e5ee;border-radius:11px;padding:14px 18px"><span style="width:10px;height:10px;border-radius:50%;background:#9aa6b6;flex-shrink:0"></span><div style="font-size:13.5px;font-weight:600;color:#5a6b82">Iniciando conexión con WhatsApp...</div></div>';

  var qrSection = '';
  if (isQR) {
    var qrImg = state.qrDataUrl
      ? '<img src="'+state.qrDataUrl+'" style="width:240px;height:240px;border-radius:12px;display:block" />'
      : '<div style="width:240px;height:240px;border-radius:12px;background:#f1f4f9;border:1px solid #e0e5ee;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9aa6b6">Cargando QR...</div>';

    qrSection = '<div style="display:flex;gap:40px;align-items:flex-start;margin-top:28px">'
      + '<div style="flex-shrink:0;padding:14px;background:#fff;border:1px solid #e3e8f0;border-radius:16px;box-shadow:0 2px 12px rgba(16,30,54,.08)">'+qrImg+'<div style="margin-top:10px;font-size:11px;color:#9aa6b6;text-align:center">El QR expira cada 60 segundos</div></div>'
      + '<div style="display:flex;flex-direction:column;gap:18px;padding-top:6px">'
        + step(1,'Abre WhatsApp en tu celular')
        + step(2,'Toca el menú ⋮ (tres puntos) o Configuración')
        + step(3,'Selecciona <b>Dispositivos vinculados</b>')
        + step(4,'Toca <b>Vincular un dispositivo</b> y escanea el código')
        + '<div style="margin-top:6px;background:#f5f8ff;border:1px solid #dde8ff;border-radius:10px;padding:13px;font-size:12.5px;color:#33405a;line-height:1.6">Una vez vinculado, el canal de WhatsApp quedará activo y los mensajes de los ciudadanos aparecerán en la bandeja automáticamente.</div>'
      + '</div>'
    + '</div>';
  } else if (isReady) {
    qrSection = '<div style="margin-top:28px;background:#f5fef8;border:1px solid #b7e4cc;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px">'
      + '<div style="font-size:14px;font-weight:700;color:#15233a">Canal activo</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
        + infoCard('Estado','Recibiendo mensajes','#1f8a5b')
        + infoCard('Canal','WhatsApp Business','#2f6fed')
        + infoCard('Asistente IA','Claude — activo','#9b7fe0')
        + infoCard('Respuesta automática','Activada','#1f8a5b')
      + '</div>'
      + '<div style="font-size:12.5px;color:#5a6b82;line-height:1.6">Para desvincular el número ve a WhatsApp → Dispositivos vinculados y elimina este dispositivo. Reinicia el servidor para escanear un QR nuevo.</div>'
    + '</div>';
  } else {
    qrSection = '<div style="margin-top:28px;display:flex;flex-direction:column;gap:16px">'
      + '<div style="font-size:13.5px;color:#5a6b82;line-height:1.7">El servidor está iniciando la conexión con WhatsApp. El código QR aparecerá aquí en unos segundos...</div>'
      + '<div style="height:4px;background:#e3e8f0;border-radius:99px;overflow:hidden"><div style="height:100%;width:60%;background:linear-gradient(90deg,#2f6fed,#5b8def);border-radius:99px;animation:progress 1.5s ease-in-out infinite alternate"></div></div>'
    + '</div>';
  }

  var resetBtn = '<div style="margin-top:22px;display:flex;flex-direction:column;gap:12px">'
    + '<div><button onclick="waReset()" style="border:1px solid #e3e8f0;background:#fff;color:#5a6b82;font-size:13px;font-weight:600;padding:10px 18px;border-radius:9px;cursor:pointer">Borrar sesión y pedir nuevo QR</button>'
    + '<span style="font-size:12px;color:#9aa6b6;margin-left:12px">Úsalo si el QR no carga o la sesión quedó corrupta</span></div>'
    + '<div><button onclick="dbTruncate()" style="border:1px solid #f5c2c2;background:#fff5f5;color:#c0392b;font-size:13px;font-weight:600;padding:10px 18px;border-radius:9px;cursor:pointer">Limpiar base de datos</button>'
    + '<span style="font-size:12px;color:#9aa6b6;margin-left:12px">Borra todas las conversaciones y mensajes. No reversible.</span></div>'
  + '</div>';

  return '<div style="height:100%;overflow:auto;padding:32px 36px">'
    + '<div style="max-width:780px">'
      + statusBar
      + qrSection
      + (!isReady ? resetBtn : '')
    + '</div>'
  + '</div>';
}

function step(n, text) {
  return '<div style="display:flex;gap:14px;align-items:flex-start">'
    + '<div style="width:28px;height:28px;border-radius:50%;background:#2f6fed;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+n+'</div>'
    + '<div style="font-size:13.5px;color:#33405a;line-height:1.6;padding-top:4px">'+text+'</div>'
  + '</div>';
}

function infoCard(label, value, color) {
  return '<div style="background:#fff;border:1px solid #e6ebf2;border-radius:10px;padding:14px">'
    + '<div style="font-size:11.5px;color:#7a8699;font-weight:600;letter-spacing:.3px;margin-bottom:5px">'+label.toUpperCase()+'</div>'
    + '<div style="font-size:13.5px;font-weight:700;color:'+(color||'#15233a')+'">'+value+'</div>'
  + '</div>';
}

/* ===================== RENDER: AGENTES ===================== */

  var rows=[
    ['SF','Sgto. Flores','Sargento','Centro',4,'Disponible'],
    ['CC','Cabo Choque','Cabo','Zona Este',6,'Ocupado'],
    ['SM','Sgto. Mamani','Sargento','Zona Sud',3,'Disponible'],
    ['OG','Of. Gutiérrez (Tú)','Oficial','Zona Norte',5,'Ocupado'],
    ['OS','Of. Salinas','Oficial','Av. Cívica',0,'Fuera de servicio']

  return '<div style="height:100%;overflow:auto;padding:24px 28px"><div style="background:#fff;border:1px solid #e6ebf2;border-radius:14px;overflow:hidden"><div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.2fr;padding:14px 20px;background:#f7f9fc;border-bottom:1px solid #eef1f6;font-size:11.5px;font-weight:600;color:#7a8699;letter-spacing:.4px"><span>AGENTE</span><span>RANGO</span><span>ZONA</span><span>CASOS ACTIVOS</span><span>ESTADO</span></div>'+rows+'</div></div>';
}

/* ===================== MAPA LEAFLET ===================== */
function initCasoMap() {
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
  var el = document.getElementById('caso-map');
  if (!el) return;
  var coordStr = el.getAttribute('data-coords');
  if (!coordStr) return;
  var parts = coordStr.split(',').map(function(s){ return parseFloat(s.trim()); });
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return;
  var lat = parts[0], lng = parts[1];

  leafletMap = L.map('caso-map', { attributionControl: false }).setView([lat, lng], 16);

  var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
  var satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

  osmLayer.addTo(leafletMap);
  L.control.layers({'🗺 Normal': osmLayer, '🛰 Satélite': satLayer}, {}, { position: 'topright' }).addTo(leafletMap);

  L.marker([lat, lng]).addTo(leafletMap)
    .bindPopup('<b>📍 Ubicación reportada</b><br><span style="font-family:monospace;font-size:11px">'+coordStr+'</span>')
    .openPopup();
}

/* ===================== RENDER PRINCIPAL ===================== */
function render(){
  var content;
  if(state.view==='bandeja') content=renderBandeja();
  else if(state.view==='stats') content=renderStats();
  else if(state.view==='mapa') content=renderMapa();
  else if(state.view==='whatsapp') content=renderWhatsapp();
  else content=renderAgentes();

  document.getElementById('app').innerHTML = renderShell(content);

  var th=document.getElementById('thread'); if(th){ th.scrollTop=th.scrollHeight; }

  if(state._focus==='search'){ var si=document.getElementById('searchInput'); if(si){ si.focus(); var n=si.value.length; si.setSelectionRange(n,n); } }
  else if(state._focus==='composer'){ var ci=document.getElementById('composerInput'); if(ci){ ci.focus(); var m=ci.value.length; ci.setSelectionRange(m,m); } }
  state._focus=null;
  setTimeout(initCasoMap, 0);
}

/* ===================== ACCIONES WHATSAPP ===================== */
function waReset() {
  fetch('/api/wa/reset', { method: 'POST' })
    .then(function(r){ return r.json(); })
    .then(function(){
      state.waStatus = 'connecting';
      state.qrDataUrl = null;
      render();
    });
}

function dbTruncate() {
  if (!confirm('¿Eliminar TODAS las conversaciones y mensajes de la base de datos? Esta acción no se puede deshacer.')) return;
  fetch('/api/db/truncate', { method: 'POST' })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res.ok) {
        state.convs = [];
        state.selectedId = null;
        render();
      } else {
        alert('Error: ' + (res.error || 'desconocido'));
      }
    });
}

/* ===================== INICIO ===================== */
render();

fetch('/api/conversations')
  .then(function(r){ return r.json(); })
  .then(function(convs){
    state.convs = convs;
    if(convs.length > 0) state.selectedId = convs[0].id;
    render();
  })
  .catch(function(){ render(); });
</script>
